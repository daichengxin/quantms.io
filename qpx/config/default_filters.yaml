# QPX Default QC Filters
# Default configuration for protein quantification quality control
# Based on standard QC filter defaults

name: default
enabled: true
log_filtered_counts: true

intensity:
  remove_zero_intensity: true

peptide:
  min_peptide_length: 7
  max_peptide_length: 50

protein:
  min_unique_peptides: 2
  remove_contaminants: true
  remove_decoys: true
  contaminant_patterns:
    - CONTAMINANT
    - ENTRAP
    - DECOY
