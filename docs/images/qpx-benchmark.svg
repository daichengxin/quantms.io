<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="s" x="-1%" y="-1%" width="102%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- White background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1e293b" letter-spacing="1">mzTab / CSV vs QPX Parquet</text>
  <text x="800" y="82" text-anchor="middle" font-size="16" fill="#64748b">PXD007683-LFQ  |  11 MS runs  |  538K PSMs  |  500K features</text>

  <!-- ═══════════════════════════════ -->
  <!-- LEFT SIDE: Bar chart -->
  <!-- ═══════════════════════════════ -->
  <rect x="60" y="110" width="900" height="560" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
  <text x="510" y="150" text-anchor="middle" font-size="22" font-weight="600" fill="#1e293b">Query Time Comparison</text>
  <text x="510" y="174" text-anchor="middle" font-size="13" fill="#94a3b8">lower is better (log scale, milliseconds)</text>

  <!-- Legend -->
  <rect x="700" y="138" width="16" height="16" rx="3" fill="#ef4444"/>
  <text x="722" y="151" font-size="14" fill="#dc2626" font-weight="500">mzTab / CSV</text>
  <rect x="835" y="138" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="857" y="151" font-size="14" fill="#2563eb" font-weight="500">QPX Parquet</text>

  <!-- Bars: x=280..920 (max bar width=640, scaled to max value 1922ms) -->

  <!-- OP 1: Count PSMs — 1031ms vs 2ms = 424x -->
  <text x="270" y="225" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Count PSMs</text>
  <rect x="280" y="205" width="343" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="633" y="225" font-size="15" font-weight="600" fill="#dc2626">1,031 ms</text>
  <rect x="280" y="237" width="4" height="28" rx="2" fill="#3b82f6"/>
  <text x="296" y="257" font-size="15" font-weight="600" fill="#2563eb">2 ms</text>
  <rect x="370" y="240" width="55" height="22" rx="5" fill="#16a34a"/>
  <text x="397" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="white">424x</text>

  <!-- OP 2: Unique proteins — 1559ms vs 55ms = 28x -->
  <text x="270" y="297" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Unique proteins</text>
  <rect x="280" y="277" width="519" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="809" y="297" font-size="15" font-weight="600" fill="#dc2626">1,559 ms</text>
  <rect x="280" y="309" width="18" height="28" rx="5" fill="#3b82f6" opacity="0.85"/>
  <text x="308" y="329" font-size="15" font-weight="600" fill="#2563eb">55 ms</text>
  <rect x="405" y="312" width="45" height="22" rx="5" fill="#16a34a"/>
  <text x="427" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="white">28x</text>

  <!-- OP 3: Count features — 956ms vs 3ms = 304x -->
  <text x="270" y="369" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Count features</text>
  <rect x="280" y="349" width="318" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="608" y="369" font-size="15" font-weight="600" fill="#dc2626">956 ms</text>
  <rect x="280" y="381" width="4" height="28" rx="5" fill="#3b82f6"/>
  <text x="296" y="401" font-size="15" font-weight="600" fill="#2563eb">3 ms</text>
  <rect x="370" y="384" width="55" height="22" rx="5" fill="#16a34a"/>
  <text x="397" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="white">304x</text>

  <!-- OP 4: Top 10 proteins — 55ms vs 40ms = 1.4x -->
  <text x="270" y="441" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Top 10 proteins</text>
  <rect x="280" y="421" width="18" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="308" y="441" font-size="15" font-weight="600" fill="#dc2626">55 ms</text>
  <rect x="280" y="453" width="13" height="28" rx="5" fill="#3b82f6" opacity="0.85"/>
  <text x="303" y="473" font-size="15" font-weight="600" fill="#2563eb">40 ms</text>
  <rect x="405" y="456" width="45" height="22" rx="5" fill="#d97706"/>
  <text x="427" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="white">1.4x</text>

  <!-- OP 5: Filter charge=2 — 1593ms vs 7ms = 241x -->
  <text x="270" y="513" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Filter charge=2</text>
  <rect x="280" y="493" width="530" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="820" y="513" font-size="15" font-weight="600" fill="#dc2626">1,593 ms</text>
  <rect x="280" y="525" width="4" height="28" rx="5" fill="#3b82f6"/>
  <text x="296" y="545" font-size="15" font-weight="600" fill="#2563eb">7 ms</text>
  <rect x="370" y="528" width="55" height="22" rx="5" fill="#16a34a"/>
  <text x="397" y="544" text-anchor="middle" font-size="13" font-weight="700" fill="white">241x</text>

  <!-- OP 6: Select 2 columns — 1922ms vs 232ms = 8x -->
  <text x="270" y="585" text-anchor="end" font-size="16" font-weight="500" fill="#334155">Select 2 columns</text>
  <rect x="280" y="565" width="640" height="28" rx="5" fill="#ef4444" opacity="0.8"/>
  <text x="633" y="606" font-size="15" font-weight="600" fill="#dc2626">1,922 ms</text>
  <rect x="280" y="597" width="77" height="28" rx="5" fill="#3b82f6" opacity="0.85"/>
  <text x="367" y="617" font-size="15" font-weight="600" fill="#2563eb">232 ms</text>
  <rect x="450" y="600" width="40" height="22" rx="5" fill="#16a34a"/>
  <text x="470" y="616" text-anchor="middle" font-size="13" font-weight="700" fill="white">8x</text>

  <!-- Note -->
  <text x="510" y="655" text-anchor="middle" font-size="13" fill="#94a3b8">mzTab requires full file scan for every query. QPX uses columnar predicate pushdown.</text>

  <!-- ═══════════════════════════════ -->
  <!-- RIGHT SIDE: Stats cards -->
  <!-- ═══════════════════════════════ -->

  <!-- Card 1: Storage -->
  <rect x="1000" y="110" width="560" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
  <text x="1280" y="150" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Storage Comparison</text>

  <!-- LFQ row -->
  <text x="1030" y="182" font-size="14" font-weight="600" fill="#64748b">DDA-LFQ (11 runs)</text>
  <rect x="1030" y="192" width="248" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="1154" y="210" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="500">mzTab.gz + CSV.gz</text>
  <text x="1154" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">48.2 MB</text>
  <rect x="1290" y="192" width="190" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="1385" y="210" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">QPX Parquet</text>
  <text x="1385" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">36.3 MB</text>
  <rect x="1490" y="198" width="50" height="30" rx="5" fill="#16a34a"/>
  <text x="1515" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="white">1.3x</text>

  <!-- TMT row -->
  <text x="1030" y="256" font-size="14" font-weight="600" fill="#64748b">DDA-TMT (120 runs, 10-plex)</text>
  <rect x="1030" y="266" width="310" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="1185" y="284" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="500">mzTab.gz + CSV.gz</text>
  <text x="1185" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">60.8 MB</text>
  <rect x="1350" y="266" width="130" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="1415" y="284" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="500">QPX Parquet</text>
  <text x="1415" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#2563eb">30.1 MB</text>
  <rect x="1490" y="272" width="50" height="30" rx="5" fill="#16a34a"/>
  <text x="1515" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="white">2.0x</text>

  <text x="1280" y="328" text-anchor="middle" font-size="12" fill="#94a3b8">TMT benefits more: multiplexed labels compress efficiently in columnar format</text>

  <!-- Card 2: Why QPX is faster -->
  <rect x="1000" y="350" width="560" height="155" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
  <text x="1280" y="384" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Why QPX is Faster</text>

  <circle cx="1040" cy="415" r="8" fill="#2563eb"/>
  <text x="1060" y="420" font-size="15" fill="#334155">Columnar format: read only needed columns</text>

  <circle cx="1040" cy="445" r="8" fill="#2563eb"/>
  <text x="1060" y="450" font-size="15" fill="#334155">Predicate pushdown: filter without full scan</text>

  <circle cx="1040" cy="475" r="8" fill="#2563eb"/>
  <text x="1060" y="480" font-size="15" fill="#334155">Binary format: no text parsing overhead</text>

  <!-- Card 3: mzTab limitations -->
  <rect x="1000" y="520" width="560" height="155" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
  <text x="1280" y="554" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">mzTab Limitations</text>

  <circle cx="1040" cy="585" r="8" fill="#dc2626"/>
  <text x="1060" y="590" font-size="15" fill="#334155">Must decompress + parse entire file for any query</text>

  <circle cx="1040" cy="615" r="8" fill="#dc2626"/>
  <text x="1060" y="620" font-size="15" fill="#334155">PSM / PRT / PEP sections interleaved in one file</text>

  <circle cx="1040" cy="645" r="8" fill="#dc2626"/>
  <text x="1060" y="650" font-size="15" fill="#334155">Text-based: no column selection possible</text>

  <!-- Bottom summary -->
  <rect x="60" y="700" width="1500" height="84" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#s)"/>

  <text x="200" y="738" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">Up to 424x faster</text>
  <text x="200" y="762" text-anchor="middle" font-size="13" fill="#64748b">for metadata queries</text>

  <text x="500" y="738" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">28-304x faster</text>
  <text x="500" y="762" text-anchor="middle" font-size="13" fill="#64748b">for analytical queries</text>

  <text x="800" y="738" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">1.3x smaller</text>
  <text x="800" y="762" text-anchor="middle" font-size="13" fill="#64748b">compressed storage</text>

  <text x="1100" y="738" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">SQL queryable</text>
  <text x="1100" y="762" text-anchor="middle" font-size="13" fill="#64748b">via DuckDB engine</text>

  <text x="1400" y="738" text-anchor="middle" font-size="18" font-weight="700" fill="#16a34a">Cross-language</text>
  <text x="1400" y="762" text-anchor="middle" font-size="13" fill="#64748b">Python, R, Rust, JS</text>

  <!-- Footer -->
  <text x="800" y="840" text-anchor="middle" font-size="12" fill="#94a3b8">Apple M1 Pro 16GB | DuckDB 1.x | Python 3.13 | gzip-compressed mzTab vs Snappy-compressed Parquet</text>
  <text x="800" y="862" text-anchor="middle" font-size="12" fill="#94a3b8">QPX: Parquet-based Proteomics Exchange Format  |  github.com/bigbio/quantms.io</text>
</svg>