<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="s" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#1e293b" letter-spacing="2">QPX</text>
  <text x="800" y="90" text-anchor="middle" font-size="17" fill="#64748b" letter-spacing="3">PARQUET-BASED PROTEOMICS EXCHANGE FORMAT</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 1: INPUT SOURCES -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="80" y="142" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2">INPUT FORMATS</text>

  <rect x="80" y="158" width="195" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
  <text x="177" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">OpenMS</text>
  <text x="177" y="212" text-anchor="middle" font-size="12" fill="#64748b">consensusXML / QPX</text>

  <rect x="295" y="158" width="195" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
  <text x="392" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">DIA-NN</text>
  <text x="392" y="212" text-anchor="middle" font-size="12" fill="#64748b">report.parquet / .tsv</text>

  <rect x="510" y="158" width="195" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
  <text x="607" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">MaxQuant</text>
  <text x="607" y="212" text-anchor="middle" font-size="12" fill="#64748b">evidence + msms.txt</text>

  <rect x="725" y="158" width="195" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
  <text x="822" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">FragPipe</text>
  <text x="822" y="212" text-anchor="middle" font-size="12" fill="#64748b">psm.tsv + combined</text>

  <rect x="940" y="158" width="195" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
  <text x="1037" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">mzIdentML</text>
  <text x="1037" y="212" text-anchor="middle" font-size="12" fill="#64748b">.mzid + .mgf</text>

  <rect x="1155" y="158" width="195" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#s)"/>
  <text x="1252" y="191" text-anchor="middle" font-size="17" font-weight="700" fill="#16a34a">SDRF</text>
  <text x="1252" y="212" text-anchor="middle" font-size="12" fill="#64748b">sample metadata</text>

  <!-- Supported labels -->
  <rect x="1370" y="158" width="150" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="1445" y="185" text-anchor="middle" font-size="12" fill="#94a3b8">LFQ / TMT</text>
  <text x="1445" y="201" text-anchor="middle" font-size="12" fill="#94a3b8">iTRAQ / SILAC</text>
  <text x="1445" y="217" text-anchor="middle" font-size="12" fill="#94a3b8">DIA / DDA</text>

  <!-- Arrows down -->
  <line x1="400" y1="230" x2="400" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="800" y1="230" x2="800" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 2: CONVERTER ENGINE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="80" y="285" width="1440" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#s)"/>
  <text x="800" y="320" text-anchor="middle" font-size="20" font-weight="600" fill="#1e293b">Converter Engine</text>
  <text x="1350" y="320" text-anchor="middle" font-size="14" fill="#94a3b8">DuckDB SQL transforms</text>
  <text x="200" y="320" text-anchor="middle" font-size="14" fill="#94a3b8">schema-validated writers</text>

  <!-- Arrow down -->
  <line x1="800" y1="343" x2="800" y2="388" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 3: QPX DATASET (main box) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="80" y="395" width="1440" height="235" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#s)"/>

  <text x="800" y="430" text-anchor="middle" font-size="24" font-weight="700" fill="#1e40af" letter-spacing="1">QPX DATASET</text>
  <text x="800" y="454" text-anchor="middle" font-size="14" fill="#3b82f6">Apache Parquet + Apache Arrow + DuckDB Engine</text>

  <!-- Identification & Quantification files -->
  <text x="120" y="485" font-size="12" font-weight="600" fill="#3b82f6" letter-spacing="1">IDENTIFICATION &amp; QUANTIFICATION</text>

  <rect x="120" y="496" width="175" height="56" rx="8" fill="#2563eb" filter="url(#s)"/>
  <text x="207" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">feature</text>
  <text x="207" y="540" text-anchor="middle" font-size="12" fill="#bfdbfe">peptides / precursors</text>

  <rect x="310" y="496" width="175" height="56" rx="8" fill="#2563eb" filter="url(#s)"/>
  <text x="397" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">pg</text>
  <text x="397" y="540" text-anchor="middle" font-size="12" fill="#bfdbfe">protein groups</text>

  <rect x="500" y="496" width="175" height="56" rx="8" fill="#2563eb" filter="url(#s)"/>
  <text x="587" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">psm</text>
  <text x="587" y="540" text-anchor="middle" font-size="12" fill="#bfdbfe">identifications</text>

  <!-- Metadata files -->
  <text x="730" y="485" font-size="12" font-weight="600" fill="#16a34a" letter-spacing="1">METADATA</text>

  <rect x="730" y="496" width="140" height="56" rx="8" fill="#16a34a" filter="url(#s)"/>
  <text x="800" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">sample</text>
  <text x="800" y="540" text-anchor="middle" font-size="12" fill="#bbf7d0">from SDRF</text>

  <rect x="885" y="496" width="140" height="56" rx="8" fill="#16a34a" filter="url(#s)"/>
  <text x="955" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">run</text>
  <text x="955" y="540" text-anchor="middle" font-size="12" fill="#bbf7d0">MS run info</text>

  <!-- Provenance & Ontology -->
  <text x="1080" y="485" font-size="12" font-weight="600" fill="#7c3aed" letter-spacing="1">PROVENANCE</text>

  <rect x="1080" y="496" width="140" height="56" rx="8" fill="#7c3aed" filter="url(#s)"/>
  <text x="1150" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">ontology</text>
  <text x="1150" y="540" text-anchor="middle" font-size="12" fill="#e9d5ff">CV terms</text>

  <rect x="1235" y="496" width="140" height="56" rx="8" fill="#7c3aed" filter="url(#s)"/>
  <text x="1305" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">provenance</text>
  <text x="1305" y="540" text-anchor="middle" font-size="12" fill="#e9d5ff">pipeline steps</text>

  <rect x="1390" y="496" width="110" height="56" rx="8" fill="#7c3aed" filter="url(#s)"/>
  <text x="1445" y="521" text-anchor="middle" font-size="16" font-weight="600" fill="white">dataset</text>
  <text x="1445" y="540" text-anchor="middle" font-size="12" fill="#e9d5ff">project info</text>

  <!-- Extended structures row -->
  <text x="120" y="576" font-size="12" font-weight="600" fill="#d97706" letter-spacing="1">EXTENDED</text>

  <rect x="120" y="586" width="155" height="30" rx="6" fill="#d97706" filter="url(#s)"/>
  <text x="197" y="606" text-anchor="middle" font-size="13" font-weight="600" fill="white">mz.parquet</text>

  <rect x="290" y="586" width="155" height="30" rx="6" fill="#d97706" filter="url(#s)"/>
  <text x="367" y="606" text-anchor="middle" font-size="13" font-weight="600" fill="white">pepmap.parquet</text>

  <rect x="460" y="586" width="185" height="30" rx="6" fill="#d97706" filter="url(#s)"/>
  <text x="552" y="606" text-anchor="middle" font-size="13" font-weight="600" fill="white">*.de.h5ad</text>

  <rect x="660" y="586" width="155" height="30" rx="6" fill="#d97706" filter="url(#s)"/>
  <text x="737" y="606" text-anchor="middle" font-size="13" font-weight="600" fill="white">*.pe.h5ad</text>

  <text x="850" y="606" font-size="12" fill="#94a3b8">MuData for DE &amp; protein expression</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 4: TRANSFORMS + VIEWS (side by side) -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="400" y1="630" x2="400" y2="665" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1100" y1="630" x2="1100" y2="665" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Transforms -->
  <rect x="80" y="672" width="660" height="82" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#s)"/>
  <text x="100" y="698" font-size="14" font-weight="700" fill="#dc2626" letter-spacing="1">TRANSFORMS</text>

  <rect x="100" y="710" width="140" height="30" rx="6" fill="#dc2626"/>
  <text x="170" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Accession Norm</text>

  <rect x="250" y="710" width="140" height="30" rx="6" fill="#dc2626"/>
  <text x="320" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">SDRF Updater</text>

  <rect x="400" y="710" width="140" height="30" rx="6" fill="#dc2626"/>
  <text x="470" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Gene Mapping</text>

  <rect x="550" y="710" width="170" height="30" rx="6" fill="#dc2626"/>
  <text x="635" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Spectra Mapping</text>

  <!-- Views -->
  <rect x="780" y="672" width="740" height="82" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#s)"/>
  <text x="800" y="698" font-size="14" font-weight="700" fill="#16a34a" letter-spacing="1">VIEWS &amp; ANALYSIS</text>

  <rect x="800" y="710" width="110" height="30" rx="6" fill="#16a34a"/>
  <text x="855" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Protein</text>

  <rect x="920" y="710" width="110" height="30" rx="6" fill="#16a34a"/>
  <text x="975" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Peptide</text>

  <rect x="1040" y="710" width="110" height="30" rx="6" fill="#16a34a"/>
  <text x="1095" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">QC</text>

  <rect x="1160" y="710" width="110" height="30" rx="6" fill="#16a34a"/>
  <text x="1215" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Sample</text>

  <rect x="1280" y="710" width="110" height="30" rx="6" fill="#16a34a"/>
  <text x="1335" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Abs. Expr.</text>

  <rect x="1400" y="710" width="100" height="30" rx="6" fill="#16a34a"/>
  <text x="1450" y="730" text-anchor="middle" font-size="12" font-weight="600" fill="white">Plotting</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 5: CLI + API + OUTPUTS -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="800" y1="754" x2="800" y2="784" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CLI bar -->
  <rect x="80" y="790" width="660" height="52" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#s)"/>
  <text x="100" y="822" font-size="14" font-weight="700" fill="#d97706" letter-spacing="1">CLI</text>

  <text x="195" y="822" font-size="15" font-weight="500" fill="#1e293b">qpx convert</text>
  <text x="340" y="822" font-size="15" font-weight="500" fill="#1e293b">qpx query</text>
  <text x="470" y="822" font-size="15" font-weight="500" fill="#1e293b">qpx transform</text>
  <text x="620" y="822" font-size="15" font-weight="500" fill="#1e293b">qpx info</text>

  <!-- Output integrations -->
  <rect x="780" y="790" width="740" height="52" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5" filter="url(#s)"/>
  <text x="800" y="822" font-size="14" font-weight="700" fill="#0891b2" letter-spacing="1">INTEGRATIONS</text>

  <text x="920" y="822" font-size="14" font-weight="500" fill="#1e293b">Python / Pandas</text>
  <text x="1050" y="822" font-size="14" font-weight="500" fill="#1e293b">MuData / AnnData</text>
  <text x="1190" y="822" font-size="14" font-weight="500" fill="#1e293b">Scanpy / Muon</text>
  <text x="1310" y="822" font-size="14" font-weight="500" fill="#1e293b">R / Arrow</text>
  <text x="1420" y="822" font-size="14" font-weight="500" fill="#1e293b">DuckDB SQL</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ROW 6: MuData EXPORT -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="800" y1="842" x2="800" y2="870" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="878" width="1440" height="100" rx="14" fill="#fdf4ff" stroke="#e879f9" stroke-width="2" filter="url(#s)"/>
  <text x="800" y="908" text-anchor="middle" font-size="20" font-weight="700" fill="#7e22ce" letter-spacing="1">MuData EXPORT</text>
  <text x="800" y="928" text-anchor="middle" font-size="13" fill="#a855f7">ds.to_mudata()  →  multi-modal scverse container  →  .h5mu / .zarr.mu</text>

  <rect x="120" y="940" width="160" height="26" rx="5" fill="#a855f7"/>
  <text x="200" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">mod["precursors"]</text>

  <rect x="300" y="940" width="150" height="26" rx="5" fill="#a855f7"/>
  <text x="375" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">mod["proteins"]</text>

  <rect x="470" y="940" width="170" height="26" rx="5" fill="#a855f7"/>
  <text x="555" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">mod["expression"]</text>

  <rect x="660" y="940" width="170" height="26" rx="5" fill="#a855f7"/>
  <text x="745" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">mod["differential"]</text>

  <rect x="850" y="940" width="185" height="26" rx="5" fill="#7e22ce"/>
  <text x="942" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">varp["feature_mapping"]</text>

  <rect x="1055" y="940" width="110" height="26" rx="5" fill="#7e22ce"/>
  <text x="1110" y="958" text-anchor="middle" font-size="12" font-weight="600" fill="white">uns metadata</text>

  <text x="1230" y="958" font-size="12" fill="#94a3b8">scverse / scanpy / muon</text>

</svg>
